name: Update packages

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Aster-Privacy/Aster-Nix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove the merged update branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/chore/package-update" --silent 2>/dev/null; then
            open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/package-update --state open --json number --jq length)"
            if [ "$open" = "0" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/chore/package-update"
            fi
          fi
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Update the apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for script in pkgs/*/update.sh; do
            bash "$script"
          done
      - name: Update nixpkgs
        run: nix flake update
      - name: Describe the update
        id: describe
        run: |
          mail="$(jq -r .version pkgs/aster-mail/sources.json)"
          bridge="$(jq -r .version pkgs/aster-bridge/sources.json)"
          if git diff --quiet -- pkgs; then
            title="chore(deps): update nixpkgs"
          elif git diff --quiet -- flake.lock; then
            title="chore(pkgs): update to mail $mail, bridge $bridge"
          else
            title="chore(pkgs): update to mail $mail, bridge $bridge, and nixpkgs"
          fi
          echo "title=$title" >>"$GITHUB_OUTPUT"
      - name: Open the pull request
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/package-update
          delete-branch: true
          sign-commits: true
          commit-message: ${{ steps.describe.outputs.title }}
          title: ${{ steps.describe.outputs.title }}
          body: Updates Aster Mail, Aster Bridge, and nixpkgs to their latest releases. It merges on its own once the builds pass.
      - name: Approve the pull request checks
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          ids=""
          for attempt in $(seq 1 12); do
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=pull_request&status=action_required"               --jq '.workflow_runs[] | select(.head_branch == "chore/package-update" and .head_repository.full_name == env.GITHUB_REPOSITORY) | .id')"
            [ -n "$ids" ] && break
            sleep 10
          done
          for id in $ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
          done
      - name: Merge once checks pass
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
