name: nixpkgs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixpkgs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for package changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            build=true
          elif git diff --quiet "$base" HEAD -- nixpkgs .github/workflows/nixpkgs.yml; then
            build=false
          else
            build=true
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: [aster-bridge-cli, aster-bridge, aster-mail]
        system: [x86_64-linux, aarch64-linux]
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Enable KVM
        if: matrix.system == 'x86_64-linux' && matrix.package == 'aster-bridge-cli'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Add the packages to nixpkgs
        run: |
          git clone --quiet --depth 1 --branch nixos-unstable https://github.com/NixOS/nixpkgs.git "$RUNNER_TEMP/nixpkgs"
          bash nixpkgs/scripts/apply.sh "$RUNNER_TEMP/nixpkgs"
      - name: Check formatting and metadata
        if: matrix.system == 'x86_64-linux' && matrix.package == 'aster-bridge-cli'
        working-directory: ${{ runner.temp }}/nixpkgs
        run: |
          nix run --file . nixfmt -- --check pkgs/by-name/as/aster-*/package.nix nixos/modules/services/mail/aster-bridge.nix nixos/tests/aster-bridge.nix maintainers/maintainer-list.nix nixos/modules/module-list.nix nixos/tests/all-tests.nix
          nix-instantiate --eval --strict -E 'with import ./. { }; map (p: map (m: m.github) p.meta.maintainers) [ aster-mail aster-bridge aster-bridge-cli ]'
          nix-instantiate -A nixosTests.aster-bridge -A aster-bridge-cli.tests.nixos >/dev/null
      - name: Build ${{ matrix.package }} from source
        working-directory: ${{ runner.temp }}/nixpkgs
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix-build --no-out-link -A "$PACKAGE"
      - name: Run the NixOS test
        if: matrix.system == 'x86_64-linux' && matrix.package == 'aster-bridge-cli'
        working-directory: ${{ runner.temp }}/nixpkgs
        run: nix-build --no-out-link -A nixosTests.aster-bridge

  nixpkgs:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, build: $BUILD"
          [ "$CHANGES" = "success" ] || exit 1
          [ "$BUILD" = "success" ] || [ "$BUILD" = "skipped" ]
